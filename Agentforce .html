<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Test Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #202124;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 25px;
            gap: 15px;
            font-size: 14px;
        }

        .topbar a {
            color: #202124;
            text-decoration: none;
        }

        .apps {
            font-size: 22px;
            cursor: pointer;
        }

        .profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #7e57c2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 120px;
        }

        .logo {
            font-size: 82px;
            font-weight: 500;
            letter-spacing: -7px;
            margin-bottom: 30px;
        }

        .search {
            width: 560px;
            max-width: 80%;
            height: 44px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
        }

        .search:hover,
        .search:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }

        .buttons {
            margin-top: 30px;
        }

        button {
            background: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            padding: 10px 16px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            border: 1px solid #dadce0;
        }

        .test-info {
            margin-top: 50px;
            padding: 15px 25px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #5f6368;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <span class="apps">⋮⋮⋮</span>
        <div class="profile">T</div>
    </div>

    <div class="main">

        <div class="logo">
            Google
        </div>

        <input
            class="search"
            type="text"
            placeholder="Search Google or type a URL"
        >

        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>

        <div class="test-info">
            Agentforce / Embedded Messaging test page
        </div>

    </div>

        </script>
    -->


</body>
</html>
